[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gyani"
version = "2.0.0"
description = "Gyani by Vivek — Ultra-lightweight AI assistant"
authors = [{name = "Vivek"}]
requires-python = ">=3.9"
dependencies = ["requests"]

[tool.setuptools.packages]
find = {include = ["gyani*"]}
